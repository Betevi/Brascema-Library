<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Brascema</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="login.css" rel="stylesheet" type="text/css" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="img/logotipo.png" alt="Brascema logo">
                    Brascema
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>
   
   <video autoplay muted loop playsinline class="video-background">
    <source src="img/dadasadsa.mp4" type="video/mp4">
    
    
</video>
    <main class="main-wrapper">
      <div class="section">
        <div class="container-medium">
          <div class="padding-vertical">
            <div class="max-width-large">
            </div>
          </div>
        </div>
      </div>

      <div class="scroll-section vertical-section section">
        <div class="wrapper"> 
          <div role="list" class="list">
            <div role="listitem" class="item">
              <div class="item_content"> 
                <img class="logoB" src="img/Computer login-bro.png" alt="imgLogin">
                <h2>Entre na sua conta</h2>
                <p class="item_p">
                  Bem-vindo ao Brascema. 
                  Por favor, faça login para acessar sua conta e continuar.
                </p>
              </div>
              <video
                src="img/dadada.mp4"
                loading="lazy"
                autoplay
                muted
                loop
                class="item_media">
              </video>
            </div>
            
            <div role="listitem" class="item">
              <div class="item_content_2">
                <img src="img/green-forest-with-moss-covered-rocks-in-a-river-picjumbo-com.jpg" alt="Background" class="item_content_2_bg">
                <section class="login-section">
                  <div class="login-container">
                    <form class="login-form">
                      <h2>Login</h2>
                      <div class="inputbox">
                        <ion-icon name="mail-outline"></ion-icon>
                        <input type="text" required>
                        <label>Email</label>
                      </div>
                      <div class="inputbox">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                        <input type="password" required>
                        <label>Senha</label>
                      </div>
                      <div class="forget">
                        <label>
                          <input type="checkbox">Lembre de mim
                        </label>
                        <a href="#">Esqueci minha senha</a>
                      </div>
                      <button type="submit" class="form-btn">Entrar</button>
                      <div class="registrar">
                        <p>Não tenho uma conta <a href="cadastro.html">Registrar</a></p>
                      </div>
                    </form>
                  </div>
                </section>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
